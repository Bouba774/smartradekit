name: Build PipsKit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Assets generator
        run: npm install --legacy-peer-deps --save-dev @capacitor/assets

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Verify tracked Android project
        run: test -f android/app/src/main/AndroidManifest.xml

      - name: Capacitor copy & sync
        run: |
          npx cap copy android
          npx cap sync android
          npx cap doctor android || true

      - name: Force Java 21 in Gradle
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Generate signing keystore
        run: |
          cd android
          keytool -genkey -v \
            -keystore release.keystore \
            -storepass PipsKit2026 \
            -alias smarttradekit \
            -keypass PipsKit2026 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PipsKit, OU=Mobile, O=PipsKit, L=Paris, S=IDF, C=FR"

      - name: Configure release signing
        run: |
          python3 << 'PYEOF'
          import re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          if "signingConfigs" not in content:
              bt = re.search(r'(\s*)buildTypes\s*\{', content)
              if bt:
                  indent = bt.group(1)
                  block = (
                      f"{indent}signingConfigs {{\n"
                      f"{indent}    release {{\n"
                      f"{indent}        storeFile file(\"../release.keystore\")\n"
                      f"{indent}        storePassword \"PipsKit2026\"\n"
                      f"{indent}        keyAlias \"smarttradekit\"\n"
                      f"{indent}        keyPassword \"PipsKit2026\"\n"
                      f"{indent}    }}\n"
                      f"{indent}}}\n\n"
                  )
                  content = content[:bt.start()] + block + content[bt.start():]

          if "signingConfig signingConfigs.release" not in content:
              bt2 = re.search(r'buildTypes\s*\{', content)
              if bt2:
                  rel = re.search(r'release\s*\{', content[bt2.end():])
                  if rel:
                      pos = bt2.end() + rel.end()
                      content = content[:pos] + "\n            signingConfig signingConfigs.release" + content[pos:]

          # Force Java 21 compileOptions to match Capacitor Android 8 requirements
          if "JavaVersion.VERSION_21" not in content:
              content = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  'compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }',
                  content,
                  flags=re.DOTALL,
              )

          with open(path, "w") as f:
              f.write(content)
          print("build.gradle patched")
          PYEOF

      - name: Gradle clean
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipsKit-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
