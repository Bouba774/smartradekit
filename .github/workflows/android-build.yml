name: Build Smart Trade Kit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Assets generator
        run: npm install --legacy-peer-deps --save-dev @capacitor/assets

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"

      - name: Capacitor sync (initial)
        run: npx cap sync android

      - name: Clean default Android icons & splashes
        run: |
          rm -rf android/app/src/main/res/mipmap-mdpi
          rm -rf android/app/src/main/res/mipmap-hdpi
          rm -rf android/app/src/main/res/mipmap-xhdpi
          rm -rf android/app/src/main/res/mipmap-xxhdpi
          rm -rf android/app/src/main/res/mipmap-xxxhdpi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable*/splash.png
          rm -f android/app/src/main/res/drawable*/ic_launcher*.png

      - name: Generate Android icons & splash from /resources
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0a1929" --iconBackgroundColorDark "#0a1929" --splashBackgroundColor "#0a1929" --splashBackgroundColorDark "#0a1929"

      - name: Capacitor sync (after assets)
        run: npx cap sync android

      - name: Force Java 17 in Gradle
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Generate signing keystore
        run: |
          cd android
          keytool -genkey -v \
            -keystore release.keystore \
            -storepass SmartTradeKit2026 \
            -alias smarttradekit \
            -keypass SmartTradeKit2026 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Smart Trade Kit, OU=Mobile, O=SmartTradeKit, L=Paris, S=IDF, C=FR"

      - name: Configure release signing
        run: |
          python3 << 'PYEOF'
          import re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          if "signingConfigs" not in content:
              bt = re.search(r'(\s*)buildTypes\s*\{', content)
              if bt:
                  indent = bt.group(1)
                  block = (
                      f"{indent}signingConfigs {{\n"
                      f"{indent}    release {{\n"
                      f"{indent}        storeFile file(\"../release.keystore\")\n"
                      f"{indent}        storePassword \"SmartTradeKit2026\"\n"
                      f"{indent}        keyAlias \"smarttradekit\"\n"
                      f"{indent}        keyPassword \"SmartTradeKit2026\"\n"
                      f"{indent}    }}\n"
                      f"{indent}}}\n\n"
                  )
                  content = content[:bt.start()] + block + content[bt.start():]

          if "signingConfig signingConfigs.release" not in content:
              bt2 = re.search(r'buildTypes\s*\{', content)
              if bt2:
                  rel = re.search(r'release\s*\{', content[bt2.end():])
                  if rel:
                      pos = bt2.end() + rel.end()
                      content = content[:pos] + "\n            signingConfig signingConfigs.release" + content[pos:]

          # Force Java 17 compileOptions
          if "JavaVersion.VERSION_17" not in content:
              content = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  'compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }',
                  content,
                  flags=re.DOTALL,
              )

          with open(path, "w") as f:
              f.write(content)
          print("build.gradle patched")
          PYEOF

      - name: Gradle clean
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTradeKit-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
