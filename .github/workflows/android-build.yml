name: Build PipsKit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify tracked android-app project
        run: test -f android-app/app/src/main/AndroidManifest.xml

      - name: Generate signing keystore
        working-directory: android-app
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -storepass PipsKit2026 \
            -alias smarttradekit \
            -keypass PipsKit2026 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PipsKit, OU=Mobile, O=PipsKit, L=Paris, S=IDF, C=FR"
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=PipsKit2026
          keyAlias=smarttradekit
          keyPassword=PipsKit2026
          EOF

      - name: Gradle wrapper permissions
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: android-app
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipsKit-APK
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
